name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.13.7

      - name: pip install
        run: pip install -r requirements.txt

      - name: Run Unit Testing for Data Cleaning Operations
        run: python tests/transformation_tests.py
        
